name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build BotWProgressMap.exe
        shell: cmd
        run: build_exe.bat
      - uses: actions/upload-artifact@v4
        with:
          name: BotWProgressMap
          path: dist/BotWProgressMap.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BotWProgressMap.exe
          generate_release_notes: true

  linux:
    # The oldest runner image: the binary needs this system's glibc (2.35) or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build BotWProgressMap-linux-x86_64
        run: sh build_linux.sh
      - name: Smoke test
        run: |
          ./dist/BotWProgressMap-linux-x86_64 --no-browser --port 8798 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8798/api/ping && break; sleep 1; done
          curl -sf http://127.0.0.1:8798/api/ping | grep -q botw-progress-map
          curl -sf http://127.0.0.1:8798/ | grep -q 'BotW Progress Map'
      - uses: actions/upload-artifact@v4
        with:
          name: BotWProgressMap-linux-x86_64
          path: dist/BotWProgressMap-linux-x86_64
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BotWProgressMap-linux-x86_64
          generate_release_notes: true
